<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lunartune-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="brutalist-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect with Brutalist Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#lunartune-bg)" stroke="#000000" stroke-width="24" filter="url(#brutalist-shadow)" />
  
  <!-- Inner Vinyl / Music Icon Symbol -->
  <g transform="translate(256, 256)">
    <!-- Outer vinyl circle -->
    <circle r="140" fill="#1E1E2E" stroke="#FFE600" stroke-width="12" />
    <circle r="105" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />
    <circle r="75" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.3" />
    
    <!-- Crescent Moon & Note Badge -->
    <circle r="50" fill="#FFE600" stroke="#000000" stroke-width="10" />
    
    <!-- Music Note Path -->
    <path d="M -12 16 L -12 -14 C -12 -22, -4 -26, 4 -22 L 22 -14 C 28 -11, 30 -4, 26 4 L 26 14 C 26 20, 20 24, 14 20 C 8 16, 12 8, 12 8" fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-10" cy="16" r="9" fill="#000000" />
    <circle cx="16" cy="14" r="9" fill="#000000" />
  </g>
</svg>
